<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="820" height="480" viewBox="0 0 820 480" xml:space="preserve" role="img" aria-label="Terminal: whoami de Pimentel.code">
  <style>
    text { font-family: 'Fira Code', 'Cascadia Code', Consolas, 'Courier New', monospace; font-size: 15px; fill: #c9d1d9; white-space: pre; }
    .user { fill: #7ee787; font-weight: 600; }
    .path { fill: #79c0ff; font-weight: 600; }
    .cmd  { fill: #f0f6fc; }
    .key  { fill: #36bcf7; }
    .dim  { fill: #8b949e; }
    .ok   { fill: #3fb950; font-weight: 600; }
    .title { fill: #8b949e; font-size: 13px; }
    .l { animation: in .35s ease both; }
    @keyframes in { from { opacity: 0; transform: translateY(4px); } }
    .cur { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { fill-opacity: 0; } }
  </style>

  <rect x="0.5" y="0.5" width="819" height="479" rx="12" fill="#0d1117" stroke="#30363d"/>
  <path d="M0.5 12.5a12 12 0 0 1 12-12h795a12 12 0 0 1 12 12v24H0.5z" fill="#161b22"/>
  <line x1="0.5" y1="36.5" x2="819.5" y2="36.5" stroke="#30363d"/>
  <circle cx="22" cy="18.5" r="6" fill="#ff5f56"/>
  <circle cx="42" cy="18.5" r="6" fill="#ffbd2e"/>
  <circle cx="62" cy="18.5" r="6" fill="#27c93f"/>
  <text class="title" x="410" y="23" text-anchor="middle">pimentel@code: ~</text>

  <g class="l" style="animation-delay:.2s">
    <text x="24" y="72"><tspan class="user">pimentel@code</tspan><tspan class="dim">:</tspan><tspan class="path">~</tspan><tspan class="dim">$ </tspan><tspan class="cmd">whoami</tspan></text>
  </g>
  <g class="l" style="animation-delay:.6s">
    <text x="24" y="96">Pimentel.code — Full-Stack Developer &amp; Automation Engineer</text>
    <text x="24" y="120" class="dim">Foz do Iguaçu, PR · GMT-3</text>
  </g>

  <g class="l" style="animation-delay:1.1s">
    <text x="24" y="156"><tspan class="user">pimentel@code</tspan><tspan class="dim">:</tspan><tspan class="path">~</tspan><tspan class="dim">$ </tspan><tspan class="cmd">ls ~/stack</tspan></text>
  </g>
  <g class="l" style="animation-delay:1.5s">
    <text x="24" y="180"><tspan class="key">frontend  </tspan><tspan class="dim"> → </tspan>Next.js · React · TypeScript · Tailwind CSS</text>
    <text x="24" y="204"><tspan class="key">backend   </tspan><tspan class="dim"> → </tspan>Node.js · Python · Supabase · PostgreSQL</text>
    <text x="24" y="228"><tspan class="key">automação </tspan><tspan class="dim"> → </tspan>n8n · WhatsApp · Instagram Graph API · Webhooks</text>
    <text x="24" y="252"><tspan class="key">ia        </tspan><tspan class="dim"> → </tspan>Agentes de IA · OpenAI · Gemini · Groq · Claude</text>
    <text x="24" y="276"><tspan class="key">infra     </tspan><tspan class="dim"> → </tspan>Vercel · Docker · VPS Linux</text>
  </g>

  <g class="l" style="animation-delay:2.1s">
    <text x="24" y="312"><tspan class="user">pimentel@code</tspan><tspan class="dim">:</tspan><tspan class="path">~</tspan><tspan class="dim">$ </tspan><tspan class="cmd">echo $FOCO</tspan></text>
  </g>
  <g class="l" style="animation-delay:2.5s">
    <text x="24" y="336">SaaS + agentes de IA que executam tarefas reais</text>
    <text x="24" y="360" class="dim"># fez a mesma coisa 2x? vira automação.</text>
  </g>

  <g class="l" style="animation-delay:3s">
    <text x="24" y="396"><tspan class="user">pimentel@code</tspan><tspan class="dim">:</tspan><tspan class="path">~</tspan><tspan class="dim">$ </tspan><tspan class="cmd">./status.sh</tspan></text>
  </g>
  <g class="l" style="animation-delay:3.4s">
    <text x="24" y="420"><tspan class="ok">● online</tspan> — disponível para novos projetos</text>
  </g>
  <g class="l" style="animation-delay:3.8s">
    <text x="24" y="456"><tspan class="user">pimentel@code</tspan><tspan class="dim">:</tspan><tspan class="path">~</tspan><tspan class="dim">$ </tspan><tspan class="cur key">▋</tspan></text>
  </g>
</svg>
